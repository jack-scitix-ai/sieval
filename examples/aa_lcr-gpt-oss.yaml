# ------------------------------------------------------------------------------
# AA-LCR — reference eval config (credential-free; fill the EDIT ME fields)
# ------------------------------------------------------------------------------
# Long-context multi-document reasoning: 100 questions, ~71k–114k input tokens.
# Candidate answers are graded by an LLM equality checker (binary CORRECT /
# INCORRECT); headline metric = accuracy. This example uses a remote
# OpenAI-compatible endpoint for the candidate; serve locally via sglang instead
# by replacing the `name`/`api_base`/`api_key` block with an `infer:` block.
#
# Flow:
#   export SIEVAL_DATA_DIR=$HOME/.sieval/data
#   sieval dataset download aa_lcr
#   sieval eval examples/aa_lcr-gpt-oss.yaml
#
# Sampling follows AA's methodology (so the number is comparable):
#   * reasoning model  -> temperature 0.6
#   * AA-LCR = 3 repeats -> n: 3 (report averages pass@1 across attempts)
#
# OUTPUT-BUDGET SAFETY (important on a long-context benchmark): gpt-oss context
# is 131072 and the longest AA-LCR input is ~114k, so `max_tokens: 16384` keeps
# input + output under the context window for every question — no request can
# overflow. Do NOT raise it past ~16k, and if you serve locally via sglang do
# NOT enable `allow_auto_truncate`: on inputs this large it would silently drop
# document tokens (or clamp output) with no error, invalidating results on a
# benchmark whose whole point is the full document set. A hard error on overflow
# is the safe behavior. Trade-off: at reasoning_effort=high the longest inputs
# have little output room and may truncate (graded INCORRECT); low fits easily.
# ------------------------------------------------------------------------------
result_dir: ./outputs/aa_lcr-gpt-oss

models:
  candidate:
    type: chat
    name: "openai/gpt-oss-120b"          # EDIT ME — served model id
    api_base: "https://your-endpoint/v1" # EDIT ME
    api_key: "YOUR_CANDIDATE_API_KEY"    # EDIT ME (literal; not ${ENV})
    args:
      temperature: 0.6                   # AA: reasoning models run at 0.6
      max_tokens: 16384                  # safe ceiling: input(<=114k)+16384 < 131072 ctx
      concurrency_limit: 8
      max_retries: 3
      extra_body:
        reasoning_effort: high           # AA reports both low and high

datasets:
  aa_lcr:
    class: AALCRDataset
    path: "${SIEVAL_DATA_DIR}/ArtificialAnalysis/AA-LCR"

tasks:
  aa_lcr_0shot_gen:
    class: AALCRZeroShotGenTask
    dataset: aa_lcr
    model: candidate
    args:
      n: 3                               # AA-LCR = 3 repeats (pass@1 aggregated)
      # LLM equality checker (AA uses Qwen3 235B A22B 2507 Non-reasoning). It is a
      # separate remote model; pin it + temperature 0 for reproducibility.
      grader:
        model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
        api_base: "https://your-grader-endpoint/v1"  # EDIT ME
        api_key: "YOUR_GRADER_API_KEY"               # EDIT ME (literal; not ${ENV})
        temperature: 0
        concurrency_limit: 8
        max_retries: 3
    runner_config:
      concurrency_limits:
        infer: 8
